# Builds the Windows and Android apps and, on a v* tag, publishes them as a GitHub Release.
# Run it by hand (Actions › Release › Run workflow) to build both apps without publishing anything.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLET_VERSION: "1.1.2"  # keep in sync with pyproject.toml
  PYTHONUTF8: "1"        # flet build crashes logging Flutter's "√" to a cp1252 console otherwise

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m unittest

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "flet[all]==$FLET_VERSION"
        shell: bash
      - name: Version
        id: version
        shell: bash
        run: .github/scripts/version.sh
      - name: Build
        shell: bash
        run: |
          flet build windows --yes --no-rich-output \
            --build-version "${{ steps.version.outputs.number }}" --build-number "${{ github.run_number }}"
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/* -DestinationPath "yt-music-playlist-downloader-windows-${{ steps.version.outputs.label }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: yt-music-playlist-downloader-windows-*.zip

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: pip install "flet[all]==$FLET_VERSION"
      - name: Version
        id: version
        run: .github/scripts/version.sh
      - name: Signing key from the repository secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.YTMPD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The YTMPD_KEYSTORE_BASE64 secret is missing: without the same key every time, the APK can't update an installed one."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ytmpd.keystore"
      - name: Build
        env:
          PIP_FIND_LINKS: ${{ github.workspace }}/android/wheels  # the QuickJS wheels (ytmpd-qjs)
          STORE_PASSWORD: ${{ secrets.YTMPD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.YTMPD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.YTMPD_KEY_PASSWORD }}
        run: |
          flet build apk --yes --no-rich-output --arch arm64-v8a x86_64 \
            --build-version "${{ steps.version.outputs.number }}" --build-number "${{ github.run_number }}" \
            --android-signing-key-store "$RUNNER_TEMP/ytmpd.keystore" \
            --android-signing-key-store-password "$STORE_PASSWORD" \
            --android-signing-key-alias "$KEY_ALIAS" --android-signing-key-password "$KEY_PASSWORD"
          cp build/apk/yt-music-playlist-downloader.apk "yt-music-playlist-downloader-${{ steps.version.outputs.label }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: yt-music-playlist-downloader-*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=$([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease || true)  # v1.2.0-beta.1 → pre-release
          gh release create "$GITHUB_REF_NAME" yt-music-playlist-downloader-* $prerelease \
            --title "$GITHUB_REF_NAME" --generate-notes \
            --notes "**Windows**: download the .zip, extract it and open yt-music-playlist-downloader.exe.
          **Android**: download the .apk on the phone and open it; it installs over the previous version and keeps the history.
          See the [README](https://github.com/$GITHUB_REPOSITORY#download-the-app) for what Windows and Android say about apps from outside their stores.

          SHA-256:
          \`\`\`
          $(sha256sum yt-music-playlist-downloader-*)
          \`\`\`"
