# Used by `flet build` to package the desktop app (and later the Android one).
# The CLI only needs requirements.txt.
[project]
name = "yt-music-playlist-downloader"
version = "0.1.0"  # keep in sync with ytmpd/__init__.py
description = "Download YouTube and YouTube Music playlists as MP3 or M4A"
requires-python = ">=3.10"
dependencies = ["flet==1.1.2", "yt-dlp[default]>=2026.10.26", "imageio-ffmpeg"]

[tool.flet]
org = "io.github.francescopazz"
product = "YT Music Playlist Downloader"
company = "Francesco Pazzaglia"
copyright = "Copyright (c) 2026 Francesco Pazzaglia"

[tool.flet.app]
exclude = ["downloads", "spike", "tests", "docs", "build", ".venv", "DEVLOG.md", "ROADMAP.md", "README.md",
           "README.it.md", "requirements.txt", "downloader.py"]
