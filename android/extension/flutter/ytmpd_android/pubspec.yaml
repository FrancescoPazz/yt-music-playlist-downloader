name: ytmpd_android
description: Android-only Flet extension for YT Music Playlist Downloader (Share menu, foreground service).
version: 0.2.0
publish_to: none

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flet: ^1.1.0
  flutter_foreground_task: 11.0.3
  # 1.9.0 compiles against Android SDK 37, which the Android Gradle Plugin of Flet 1.1.2's template can't find
  receive_sharing_intent: 1.8.1
